name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install gdb
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Diagnostics
        run: |
          gdb --version | head -1
          gcc --version | head -1
          g++ --version | head -1
          ldd --version | head -1
          node --version
          cat /proc/sys/kernel/yama/ptrace_scope || true

      - name: libstdc++ GDB pretty-printers (M8 STL support reads containers through them)
        run: |
          printf '#include <map>\nint main() {\n  std::map<int, int> m{{1, 2}};\n  return (int)m.size() - 1;\n}\n' > /tmp/pp.cpp
          g++ -g -O0 -o /tmp/pp /tmp/pp.cpp
          gdb -q -batch -ex 'break 4' -ex run -ex 'info pretty-printer' -ex 'p m' /tmp/pp 2>&1 | grep -v '^$' || true
          echo '--- auto-load scripts'; ls /usr/share/gdb/auto-load/usr/lib/*/ 2>&1 | head || true
          echo '--- gcc python dir';   ls -d /usr/share/gcc*/python/libstdcxx 2>&1 || true
          dpkg -l 2>/dev/null | grep -E 'libstdc\+\+6|libstdc\+\+-.*-dev' | awk '{print $2, $3}' || true

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      - name: Package .vsix
        run: npm run package -w extension -- -o ../dsv.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: dsv-vsix
          path: dsv.vsix
          if-no-files-found: error
